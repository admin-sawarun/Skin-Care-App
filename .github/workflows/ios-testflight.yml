# Builds the iOS app on a GitHub-hosted Mac and uploads it to TestFlight.
# Run it by hand: GitHub → Actions → "iOS → TestFlight" → Run workflow.
#
# Signing is fully automatic (Xcode cloud signing through an App Store Connect
# API key), so no certificates or provisioning profiles are stored here.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID                  10-character Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID                     App Store Connect API key ID
#   ASC_ISSUER_ID                  App Store Connect issuer ID
#   ASC_KEY_P8                     contents of the AuthKey_XXXX.p8 file (Admin role key)
#   GOOGLE_SERVICE_INFO_PLIST_B64  base64 of GoogleService-Info.plist for com.lockandkey.skincare
name: iOS → TestFlight

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Backend URL baked into the app
        default: https://skin-care-app-production-1925.up.railway.app
        required: true

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Use the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Write secrets to files
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          printf '%s' "$PLIST_B64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          plutil -lint ios/Runner/GoogleService-Info.plist

      - name: Add the Firebase phone auth URL scheme
        # Firebase phone auth falls back to reCAPTCHA, which needs the encoded
        # iOS app ID ("app-1-...-ios-...") as a URL scheme.
        run: |
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :GOOGLE_APP_ID' ios/Runner/GoogleService-Info.plist)
          SCHEME="app-$(echo "$APP_ID" | tr ':' '-')"
          if ! /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes' ios/Runner/Info.plist >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes array' ios/Runner/Info.plist
          fi
          if ! grep -q "$SCHEME" ios/Runner/Info.plist; then
            N=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes' ios/Runner/Info.plist | grep -c 'Dict {' || true)
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:$N dict" ios/Runner/Info.plist
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:$N:CFBundleURLSchemes array" ios/Runner/Info.plist
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:$N:CFBundleURLSchemes:0 string $SCHEME" ios/Runner/Info.plist
          fi
          echo "URL scheme: $SCHEME"

      - name: Flutter build (no signing yet)
        run: |
          flutter pub get
          flutter build ios --release --no-codesign \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL=${{ inputs.api_base_url }}

      - name: Archive (cloud signing)
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" CODE_SIGN_STYLE=Automatic \
            archive

      - name: Upload to App Store Connect / TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Remove the key file
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
